<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Micro reservoir</title>
<link rel="stylesheet" href="scenes.css">
</head>
<body>
<div id="stage">
  <canvas id="canvas"></canvas>
</div>
<div id="debug-panel">
  <div id="debug-scene-title">—</div>
  <div id="debug-scene-desc">—</div>
  <div id="debug-scene-time">—</div>
  <div id="debug-scene-next">—</div>
  <div id="debug-scene-bar"><div id="debug-scene-bar-fill"></div></div>
  <div id="debug-scene-jumps"></div>
</div>
<div id="control-btns">
  <button id="stop-btn" type="button">Stop</button>
  <button id="reset-btn" type="button">Reset</button>
</div>
<script src="../live_viewer/math.js"></script>
<script src="sim-core.js"></script>
<script src="scenes.js"></script>
<script>
const { MicroReservoir, fitCanvas, PALETTE, macroBlendAt } = PaperSocial;
const { sceneAt, SCENES, sceneStarts } = SceneLexicon;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const res = new MicroReservoir({ sigma: 1.0, histMax: 512 });

const SHOW_DEBUG = new URLSearchParams(location.search).get("debug") !== "0";

const debugPanel = document.getElementById("debug-panel");
const debugTitle = document.getElementById("debug-scene-title");
const debugDesc = document.getElementById("debug-scene-desc");
const debugTime = document.getElementById("debug-scene-time");
const debugNext = document.getElementById("debug-scene-next");
const debugBarFill = document.getElementById("debug-scene-bar-fill");
const debugJumps = document.getElementById("debug-scene-jumps");

if (!SHOW_DEBUG) debugPanel.classList.add("hidden");

const sceneJumpBtns = SCENES.map((scene, i) => {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "scene-jump-btn";
  btn.textContent = `Scene ${scene.id}`;
  btn.title = scene.title;
  btn.addEventListener("click", () => jumpToScene(i));
  debugJumps.appendChild(btn);
  return btn;
});

let tStart = performance.now();
let paused = false;
let tPaused = 0;

const stopBtn = document.getElementById("stop-btn");

function getTSec() {
  return paused ? tPaused : (performance.now() - tStart) * 0.001;
}

function jumpToScene(index) {
  const starts = sceneStarts();
  tStart = performance.now() - starts[index] * 1000;
  tPaused = starts[index];
}

function resetAnimation() {
  jumpToScene(0);
  res.seedRandom();
}

function togglePause() {
  if (paused) {
    tStart = performance.now() - tPaused * 1000;
    paused = false;
    stopBtn.textContent = "Stop";
  } else {
    tPaused = getTSec();
    paused = true;
    stopBtn.textContent = "Play";
  }
}

stopBtn.addEventListener("click", togglePause);
document.getElementById("reset-btn").addEventListener("click", resetAnimation);

function layout(w, h) {
  const marginX = Math.max(20, w * 0.012);
  const marginBottom = Math.max(16, h * 0.012);
  const gap = Math.max(12, h * 0.01);
  const netH = h * 0.58;

  return {
    marginX,
    marginBottom,
    gap,
    netH,
    netCyStart: marginX + netH * 0.5,
    netCyEnd: h * 0.5,
    radiusStart: Math.min(w, netH) * 0.4,
    radiusEnd: Math.min(w, h) * 0.38,
    rasterY: marginX + netH + gap,
    rasterW: w - marginX * 2,
    rasterH: h - (marginX + netH + gap) - marginBottom,
  };
}

function drawSceneMicro(L) {
  res.drawNetwork(ctx, canvas._fw * 0.5, L.netCyStart, L.radiusStart, {
    showRing: false,
    glowLight: true,
  });
  res.drawRaster(ctx, L.marginX, L.rasterY, L.rasterW, L.rasterH);
}

function drawSceneTransition(L, u, w, h) {
  const netCy = L.netCyStart + (L.netCyEnd - L.netCyStart) * u;
  const radius = L.radiusStart + (L.radiusEnd - L.radiusStart) * u;
  res.drawNetwork(ctx, w * 0.5, netCy, radius, { showRing: false, glowLight: true });

  const rasterAlpha = 1 - u;
  if (rasterAlpha > 0.002) {
    const slide = u * (L.rasterH + L.marginBottom + h * 0.06);
    ctx.save();
    ctx.globalAlpha = rasterAlpha;
    ctx.beginPath();
    ctx.rect(L.marginX, L.rasterY, L.rasterW, L.rasterH + slide);
    ctx.clip();
    ctx.translate(0, slide);
    res.drawRaster(ctx, L.marginX, L.rasterY, L.rasterW, L.rasterH);
    ctx.restore();
  }
}

/** Same single reservoir — inner network shrinks/fades; light node stays fixed size. */
function drawSceneZoomOut(L, u, w, h) {
  const cx = w * 0.5;
  const cy = L.netCyEnd;
  const detail = u <= 0 ? 1 : 1 - u;
  const radius = u <= 0 ? L.radiusEnd : Math.max(4, L.radiusEnd * (1 - u * 0.94));
  const fixedLightR = Math.max(2.2, L.radiusEnd * 0.09);
  const macroBlend = macroBlendAt(u);

  if (detail > 0.02) {
    res.drawNetwork(ctx, cx, cy, radius, {
      showRing: false,
      glowLight: false,
      detail,
      fixedLightR,
      macroBlend,
    });
  } else {
    res.drawLight(ctx, cx, cy, fixedLightR, { macroBlend });
  }
}

function updateDebugPanel(st) {
  if (!SHOW_DEBUG) return;
  const { scene, tInScene, u, index } = st;
  debugTitle.textContent = scene.title;
  debugDesc.textContent = scene.description;
  debugTime.textContent = `${tInScene.toFixed(1)}s / ${scene.duration.toFixed(1)}s`;
  const next = SCENES[index + 1];
  if (next) {
    debugNext.textContent = `next → ${next.title}`;
  } else if (u >= 1) {
    debugNext.textContent = "end of timeline";
  } else {
    debugNext.textContent = "—";
  }
  debugBarFill.style.width = `${(u * 100).toFixed(1)}%`;
  sceneJumpBtns.forEach((btn, i) => {
    btn.classList.toggle("active", i === index);
  });
}

function draw() {
  const { w, h } = fitCanvas(canvas, ctx);
  canvas._fw = w;
  canvas._fh = h;

  const tSec = getTSec();
  const st = sceneAt(tSec);
  const L = layout(w, h);

  ctx.fillStyle = PALETTE.bg;
  ctx.fillRect(0, 0, w, h);

  if (st.scene.key === "micro") {
    drawSceneMicro(L);
  } else if (st.scene.key === "transition") {
    drawSceneTransition(L, st.animU, w, h);
  } else if (st.scene.key === "zoomOut") {
    drawSceneZoomOut(L, st.animU, w, h);
  }

  ctx.strokeStyle = "rgba(252,255,164,0.45)";
  ctx.lineWidth = 3;
  ctx.strokeRect(1.5, 1.5, w - 3, h - 3);

  updateDebugPanel(st);
}

function loop() {
  if (!paused) {
    res.step(2);
    tPaused = getTSec();
  }
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
