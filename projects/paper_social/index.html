<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Micro reservoir</title>
<link rel="stylesheet" href="scenes.css">
</head>
<body>
<div id="stage">
  <canvas id="canvas"></canvas>
</div>
<div id="debug-panel">
  <div id="debug-scene-title">—</div>
  <div id="debug-scene-desc">—</div>
  <div id="debug-scene-time">—</div>
  <div id="debug-scene-frame">—</div>
  <div id="debug-scene-scrub">
    <button id="frame-prev" type="button" title="Previous frame (←)">−1</button>
    <input id="debug-scene-slider" type="range" min="0" max="0" value="0" step="1" aria-label="Timeline scrubber" />
    <button id="frame-next" type="button" title="Next frame (→)">+1</button>
  </div>
  <div id="debug-scene-next">—</div>
  <div id="debug-macro-tune" class="hidden">
    <div class="debug-macro-tune-row">
      <span class="debug-macro-tune-label">Micro σ</span>
      <input id="macro-sigma-slider" type="range" min="40" max="160" value="108" step="1" aria-label="Micro branching ratio sigma" />
      <span id="macro-sigma-val" class="debug-macro-tune-val">1.08</span>
    </div>
    <div class="debug-macro-tune-row">
      <span class="debug-macro-tune-label">Vision v_r</span>
      <input id="macro-vd-slider" type="range" min="5" max="120" value="55" step="5" aria-label="Vision radius" />
      <span id="macro-vd-val" class="debug-macro-tune-val">55</span>
    </div>
    <div class="debug-macro-tune-row">
      <span class="debug-macro-tune-label">Layout seed</span>
      <button id="macro-seed-prev" type="button" class="macro-seed-step" title="Previous seed">−</button>
      <input id="macro-seed-slider" type="range" min="0" max="4095" value="42" step="1" aria-label="Agent layout seed" />
      <button id="macro-seed-next" type="button" class="macro-seed-step" title="Next seed">+</button>
      <span id="macro-seed-val" class="debug-macro-tune-val">42</span>
    </div>
    <div class="debug-macro-tune-hint">Scene 5 only · σ ≈ 1 for critical cascades</div>
  </div>
  <div id="debug-scene-jumps"></div>
</div>
<div id="control-btns">
  <button id="stop-btn" type="button">Stop</button>
  <button id="reset-btn" type="button">Reset</button>
</div>
<script src="../live_viewer/math.js"></script>
<script src="sim-core.js"></script>
<script src="macro-pop.js"></script>
<script src="scenes.js"></script>
<script>
const { MicroReservoir, fitCanvas, PALETTE, macroBlendAt, drawBidirectionalCoupling } = PaperSocial;
const { MacroPopulation, MACRO_POP_SEED, MACRO_VD, MACRO_SIGMA, MACRO_P } = PaperSocialMacro;
const { sceneAt, SCENES, sceneStarts, easeInOutCubic, totalAnimatedDuration } = SceneLexicon;

const RECORD_FPS = 30;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const res = new MicroReservoir({ sigma: 1.0, histMax: 512 });
const resB = new MicroReservoir({ sigma: 1.0, histMax: 512, heading: Math.PI });
const macroPop = new MacroPopulation({ seed: MACRO_POP_SEED, vd: MACRO_VD, pMicro: MACRO_P });

const COLLAPSE_FRAC = 0.22;
const CAMERA_START = 0.10;
const CAMERA_END = 0.54;
const PROXY_OUT_START = 0.54;
const HANDOFF_END = 0.72;
const MACRO_IN_END = 0.72;
const MACRO_ZOOM_END = 1.0;

function smoothstep(x) {
  const t = Math.min(1, Math.max(0, x));
  return t * t * (3 - 2 * t);
}

const SHOW_DEBUG = new URLSearchParams(location.search).get("debug") !== "0";

const debugPanel = document.getElementById("debug-panel");
const debugTitle = document.getElementById("debug-scene-title");
const debugDesc = document.getElementById("debug-scene-desc");
const debugTime = document.getElementById("debug-scene-time");
const debugFrame = document.getElementById("debug-scene-frame");
const debugNext = document.getElementById("debug-scene-next");
const debugSlider = document.getElementById("debug-scene-slider");
const framePrevBtn = document.getElementById("frame-prev");
const frameNextBtn = document.getElementById("frame-next");
const debugJumps = document.getElementById("debug-scene-jumps");
const macroTunePanel = document.getElementById("debug-macro-tune");
const macroSigmaSlider = document.getElementById("macro-sigma-slider");
const macroSigmaVal = document.getElementById("macro-sigma-val");
const macroVdSlider = document.getElementById("macro-vd-slider");
const macroVdVal = document.getElementById("macro-vd-val");
const macroSeedSlider = document.getElementById("macro-seed-slider");
const macroSeedVal = document.getElementById("macro-seed-val");
const macroSeedPrev = document.getElementById("macro-seed-prev");
const macroSeedNext = document.getElementById("macro-seed-next");

if (!SHOW_DEBUG) debugPanel.classList.add("hidden");
else macroTunePanel.classList.add("hidden");

function syncMacroTuneReadouts() {
  const sigma = macroPop.microSigma();
  macroSigmaSlider.value = String(Math.round(sigma * 100));
  macroSigmaVal.textContent = sigma.toFixed(2);
  macroVdSlider.value = String(macroPop.vd);
  macroVdVal.textContent = String(macroPop.vd);
  macroSeedSlider.value = String(macroPop.seed >>> 0);
  macroSeedVal.textContent = String(macroPop.seed >>> 0);
}

function applyMacroSigmaFromSlider() {
  const sigma = parseInt(macroSigmaSlider.value, 10) / 100;
  macroPop.setMicroSigma(sigma);
  macroSigmaVal.textContent = sigma.toFixed(2);
}

function applyMacroVdFromSlider() {
  const vd = parseInt(macroVdSlider.value, 10);
  macroPop.setVisionRadius(vd);
  macroVdVal.textContent = String(vd);
}

function applyMacroSeed(seed) {
  const clamped = Math.min(4095, Math.max(0, seed >>> 0));
  macroPop.setSeed(clamped);
  macroSeedSlider.value = String(clamped);
  macroSeedVal.textContent = String(clamped);
}

function applyMacroSeedFromSlider() {
  applyMacroSeed(parseInt(macroSeedSlider.value, 10));
}

if (SHOW_DEBUG) {
  macroSigmaSlider.addEventListener("input", applyMacroSigmaFromSlider);
  macroVdSlider.addEventListener("input", applyMacroVdFromSlider);
  macroSeedSlider.addEventListener("input", applyMacroSeedFromSlider);
  macroSeedPrev.addEventListener("click", () => applyMacroSeed(macroPop.seed - 1));
  macroSeedNext.addEventListener("click", () => applyMacroSeed(macroPop.seed + 1));
  syncMacroTuneReadouts();
}

const sceneJumpBtns = SCENES.map((scene, i) => {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "scene-jump-btn";
  btn.textContent = `Scene ${scene.id}`;
  btn.title = scene.title;
  btn.addEventListener("click", () => jumpToScene(i));
  debugJumps.appendChild(btn);
  return btn;
});

let tStart = performance.now();
let paused = false;
let prevSceneKey = null;
let tPaused = 0;
let scrubbing = false;

const stopBtn = document.getElementById("stop-btn");

function timelineFrameCount() {
  return Math.max(1, Math.ceil(totalAnimatedDuration() * RECORD_FPS));
}

function timeFromFrame(frame) {
  return Math.min(totalAnimatedDuration(), Math.max(0, frame / RECORD_FPS));
}

function frameFromTime(tSec) {
  return Math.min(
    timelineFrameCount() - 1,
    Math.max(0, Math.round(tSec * RECORD_FPS)),
  );
}

function pauseForScrub() {
  if (!paused) {
    tPaused = getTSec();
    paused = true;
    stopBtn.textContent = "Play";
  }
}

function seekToFrame(frame) {
  const clamped = Math.min(timelineFrameCount() - 1, Math.max(0, frame));
  const t = timeFromFrame(clamped);
  tPaused = t;
  tStart = performance.now() - t * 1000;
  if (SHOW_DEBUG && !scrubbing) {
    debugSlider.value = String(clamped);
  }
}

function stepFrame(delta) {
  pauseForScrub();
  seekToFrame(frameFromTime(getTSec()) + delta);
}

function initTimelineScrubber() {
  const maxFrame = timelineFrameCount() - 1;
  debugSlider.max = String(maxFrame);
  debugSlider.value = "0";
  debugSlider.addEventListener("pointerdown", () => {
    scrubbing = true;
    pauseForScrub();
  });
  debugSlider.addEventListener("pointerup", () => {
    scrubbing = false;
  });
  debugSlider.addEventListener("input", () => {
    pauseForScrub();
    seekToFrame(parseInt(debugSlider.value, 10));
  });
  framePrevBtn.addEventListener("click", () => stepFrame(-1));
  frameNextBtn.addEventListener("click", () => stepFrame(1));
}

if (SHOW_DEBUG) initTimelineScrubber();

function getTSec() {
  return paused ? tPaused : (performance.now() - tStart) * 0.001;
}

function jumpToScene(index) {
  pauseForScrub();
  const starts = sceneStarts();
  seekToFrame(frameFromTime(starts[index]));
}

function resetAnimation() {
  jumpToScene(0);
  res.seedRandom();
  resB.seedRandom();
  macroPop.setSeed(MACRO_POP_SEED);
  macroPop.setVisionRadius(MACRO_VD);
  macroPop.setMicroSigma(MACRO_SIGMA);
  if (SHOW_DEBUG) syncMacroTuneReadouts();
}

function togglePause() {
  if (paused) {
    tStart = performance.now() - tPaused * 1000;
    paused = false;
    stopBtn.textContent = "Stop";
  } else {
    tPaused = getTSec();
    paused = true;
    stopBtn.textContent = "Play";
  }
}

stopBtn.addEventListener("click", togglePause);
document.getElementById("reset-btn").addEventListener("click", resetAnimation);

document.addEventListener("keydown", (e) => {
  if (!SHOW_DEBUG || e.target.matches("input, textarea, select")) return;
  if (e.key === "ArrowLeft") {
    e.preventDefault();
    stepFrame(-1);
  } else if (e.key === "ArrowRight") {
    e.preventDefault();
    stepFrame(1);
  }
});

function layout(w, h) {
  const marginX = Math.max(20, w * 0.012);
  const marginBottom = Math.max(16, h * 0.012);
  const gap = Math.max(12, h * 0.01);
  const netH = h * 0.58;

  return {
    marginX,
    marginBottom,
    gap,
    netH,
    netCyStart: marginX + netH * 0.5,
    netCyEnd: h * 0.5,
    radiusStart: Math.min(w, netH) * 0.4,
    radiusEnd: Math.min(w, h) * 0.38,
    rasterY: marginX + netH + gap,
    rasterW: w - marginX * 2,
    rasterH: h - (marginX + netH + gap) - marginBottom,
  };
}

function drawSceneMicro(L) {
  res.drawNetwork(ctx, canvas._fw * 0.5, L.netCyStart, L.radiusStart, {
    showRing: false,
    glowLight: true,
  });
  res.drawRaster(ctx, L.marginX, L.rasterY, L.rasterW, L.rasterH);
}

function drawSceneTransition(L, u, w, h) {
  const netCy = L.netCyStart + (L.netCyEnd - L.netCyStart) * u;
  const radius = L.radiusStart + (L.radiusEnd - L.radiusStart) * u;
  res.drawNetwork(ctx, w * 0.5, netCy, radius, { showRing: false, glowLight: true });

  const rasterAlpha = 1 - u;
  if (rasterAlpha > 0.002) {
    const slide = u * (L.rasterH + L.marginBottom + h * 0.06);
    ctx.save();
    ctx.globalAlpha = rasterAlpha;
    ctx.beginPath();
    ctx.rect(L.marginX, L.rasterY, L.rasterW, L.rasterH + slide);
    ctx.clip();
    ctx.translate(0, slide);
    res.drawRaster(ctx, L.marginX, L.rasterY, L.rasterW, L.rasterH);
    ctx.restore();
  }
}

/** Positions for side-by-side pair; u=0 matches Scene 2 end (one centered reservoir). */
function pairGeometry(w, h, u) {
  const L = layout(w, h);
  const cy = L.netCyEnd;
  const rEnd = L.radiusEnd;
  const rPair = Math.min(rEnd * 0.68, w * 0.165);
  const halfSep = rPair * 1.42;
  const cxMid = w * 0.5;
  const cxA_final = cxMid - halfSep;
  const cxB_final = cxMid + halfSep;

  const spread = easeInOutCubic(Math.min(1, Math.max(0, (u - 0.08) / 0.52)));
  const spreadB = easeInOutCubic(Math.min(1, Math.max(0, (u - 0.18) / 0.52)));
  const cxA = cxMid + (cxA_final - cxMid) * spread;
  const cxB = cxB_final + (w + rPair * 1.5 - cxB_final) * (1 - spreadB);
  const radius = rEnd + (rPair - rEnd) * spread;
  const headingA = -Math.PI / 2 + spread * (Math.PI / 2);
  const headingB = Math.PI;
  const linkAlpha = easeInOutCubic(Math.min(1, Math.max(0, (u - 0.42) / 0.58)));

  return {
    cy, cxA, cxB, radius, rPair, rEnd, bAlpha: spreadB, linkAlpha, headingA, headingB, L,
  };
}

function drawPairCoupling(G, linkAlpha, macroBlend, opts) {
  if (linkAlpha <= 0.002) return;
  const cyA = G.cyA ?? G.cy;
  const cyB = G.cyB ?? G.cy;
  drawBidirectionalCoupling(ctx, G.cxA, cyA, G.cxB, cyB, {
    alpha: linkAlpha,
    macroBlend,
    centerToCenter: opts?.centerToCenter ?? false,
    radius: G.radius ?? G.rPair,
    radiusBase: G.rPair,
    nNeurons: res.n,
    nSensors: res.nSensors,
    headingA: G.headingA,
    headingB: G.headingB,
    aLightOn: res.lightOn(),
    bLightOn: resB.lightOn(),
  });
}

function drawScenePair(L, u, w, h) {
  const G = pairGeometry(w, h, u);

  if (G.bAlpha > 0.45) {
    drawPairCoupling(G, G.linkAlpha * G.bAlpha, 0);
  }

  res.drawNetwork(ctx, G.cxA, G.cy, G.radius, {
    showRing: false,
    glowLight: true,
    heading: G.headingA,
  });

  if (G.bAlpha > 0.002) {
    ctx.save();
    ctx.globalAlpha = G.bAlpha;
    resB.drawNetwork(ctx, G.cxB, G.cy, G.radius, {
      showRing: false,
      glowLight: true,
      heading: G.headingB,
    });
    ctx.restore();
  }
}

function drawAgentCollapse(reservoir, cx, cy, radiusBase, u, heading, macroBlend) {
  const detail = u <= 0 ? 1 : 1 - u;
  const radius = u <= 0 ? radiusBase : Math.max(4, radiusBase * (1 - u * 0.94));
  const fixedLightR = Math.max(2.2, radiusBase * 0.09);

  if (detail > 0.02) {
    reservoir.drawNetwork(ctx, cx, cy, radius, {
      showRing: false,
      glowLight: false,
      detail,
      fixedLightR,
      macroBlend,
      heading,
    });
  } else {
    reservoir.drawLight(ctx, cx, cy, fixedLightR, { macroBlend });
  }
}

function drawProxyDot(reservoir, x, y, r, alpha, macroBlend) {
  if (alpha <= 0.002) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  reservoir.drawLight(ctx, x, y, r, { macroBlend: macroBlend ?? 1 });
  ctx.restore();
}

function scene4Phases(u) {
  const collapseU = smoothstep(Math.min(1, Math.max(0, u / COLLAPSE_FRAC)));
  const cameraU = smoothstep(Math.min(1, Math.max(0, (u - CAMERA_START) / (CAMERA_END - CAMERA_START))));
  const handoffU = u <= PROXY_OUT_START
    ? 0
    : smoothstep(Math.min(1, Math.max(0, (u - PROXY_OUT_START) / (HANDOFF_END - PROXY_OUT_START))));
  const proxyAlpha = Math.max(0, 1 - handoffU);
  const macroInU = handoffU;
  return { collapseU, cameraU, handoffU, macroInU, proxyAlpha };
}

function getMacroGraphU(tSec) {
  const st = sceneAt(tSec);
  if (st.scene.key !== "dualZoomOut") return 0;
  const { cameraU, macroInU } = scene4Phases(st.u);
  return macroInU > 0 ? macroInU : (cameraU >= 0.92 ? 0.12 : 0);
}

function drawSceneDualZoomOut(L, u, w, h) {
  const G = pairGeometry(w, h, 1);
  macroPop.ensureCenterAnchors(w, h, MACRO_ZOOM_END);
  const { collapseU, cameraU, macroInU, proxyAlpha } = scene4Phases(u);
  const macroBlend = macroBlendAt(Math.max(collapseU, cameraU));
  const linkBlend = Math.max(macroBlend, cameraU);
  const useCenterLink = collapseU > 0.72 || cameraU > 0.02;
  const fixedLightR = Math.max(2.2, G.rPair * 0.09);

  const fullOrig = macroPop.fullFieldOrigin(w, h, MACRO_ZOOM_END);
  const fullTransform = macroPop.buildTransform(w, h, { origin: fullOrig });
  const fullR = fullTransform.r;

  const endA = macroPop.agentScreen(macroPop.anchorA, fullTransform);
  const endB = macroPop.agentScreen(macroPop.anchorB, fullTransform);
  const posT = cameraU;
  const dotAx = G.cxA + (endA.x - G.cxA) * posT;
  const dotAy = G.cy + (endA.y - G.cy) * posT;
  const dotBx = G.cxB + (endB.x - G.cxB) * posT;
  const dotBy = G.cy + (endB.y - G.cy) * posT;
  const dotR = fixedLightR + (fullR - fixedLightR) * posT;

  const nodeIn = macroInU;
  const edgeIn = smoothstep(Math.max(0, (macroInU - 0.18) / 0.82));
  const edgeInSoft = edgeIn * edgeIn * (3 - 2 * edgeIn);
  const rippleCx = (endA.x + endB.x) * 0.5;
  const rippleCy = (endA.y + endB.y) * 0.5;

  const showMacro = macroInU > 0.002;
  const showProxy = proxyAlpha > 0.002;

  if (showMacro) {
    macroPop.draw(ctx, w, h, {
      reveal: 1,
      revealMul: nodeIn,
      uniformReveal: true,
      transform: fullTransform,
      agentR: fullR,
      edgeAlpha: edgeInSoft,
      rippleCx,
      rippleCy,
      edgeRipple: macroInU < 0.96,
    });
  }

  const pairLinkBase = Math.max(collapseU, cameraU);
  const pairLinkAlpha = proxyAlpha * pairLinkBase * (1 - edgeInSoft * 0.92);
  if (pairLinkAlpha > 0.002) {
    drawPairCoupling({
      ...G,
      cxA: dotAx,
      cxB: dotBx,
      cyA: dotAy,
      cyB: dotBy,
      radius: dotR,
    }, pairLinkAlpha, linkBlend, { centerToCenter: useCenterLink });
  }

  if (!showProxy) return;

  const detail = 1 - collapseU;
  if (detail > 0.04) {
    drawAgentCollapse(res, dotAx, dotAy, G.rPair, collapseU, G.headingA, macroBlend);
    drawAgentCollapse(resB, dotBx, dotBy, G.rPair, collapseU, G.headingB, macroBlend);
  } else {
    drawProxyDot(res, dotAx, dotAy, dotR, proxyAlpha, macroInU);
    drawProxyDot(resB, dotBx, dotBy, dotR, proxyAlpha, macroInU);
  }
}

function drawFullMacroField(w, h) {
  macroPop.ensureCenterAnchors(w, h, MACRO_ZOOM_END);
  const fullOrig = macroPop.fullFieldOrigin(w, h, MACRO_ZOOM_END);
  const fullTransform = macroPop.buildTransform(w, h, { origin: fullOrig });
  macroPop.draw(ctx, w, h, {
    reveal: 1,
    revealMul: 1,
    uniformReveal: true,
    transform: fullTransform,
    agentR: fullTransform.r,
    edgeAlpha: 1,
    edgeRipple: false,
  });
}

function drawSceneMacro(_L, _u, w, h) {
  drawFullMacroField(w, h);
}

function drawSceneMacroRaster(L, u, w, h) {
  const t = easeInOutCubic(u);
  const fullOrig = macroPop.fullFieldOrigin(w, h, MACRO_ZOOM_END);
  const bandTop = L.marginX;
  const bandH = L.netH;
  const bandOrig = macroPop.bandFieldOrigin(w, bandTop, bandH);
  const bandClip = { x: L.marginX, y: bandTop, w: L.rasterW, h: bandH };
  const origin = macroPop.lerpOrigin(fullOrig, bandOrig, t);

  const padFrac = 0.035;
  const fullClip = { x: w * padFrac, y: h * padFrac, w: w * (1 - padFrac * 2), h: h * (1 - padFrac * 2) };
  const clip = {
    x: fullClip.x + (bandClip.x - fullClip.x) * t,
    y: fullClip.y + (bandClip.y - fullClip.y) * t,
    w: fullClip.w + (bandClip.w - fullClip.w) * t,
    h: fullClip.h + (bandClip.h - fullClip.h) * t,
  };

  const fullTransform = macroPop.buildTransform(w, h, { origin: fullOrig });
  const endTransform = macroPop.buildTransform(w, h, { origin: bandOrig, clip: bandClip });
  const transform = macroPop.buildTransform(w, h, { origin, clip });
  const agentR = fullTransform.r + (endTransform.r - fullTransform.r) * t;

  macroPop.draw(ctx, w, h, {
    reveal: 1,
    revealMul: 1,
    uniformReveal: true,
    transform,
    agentR,
    edgeAlpha: 1,
    edgeRipple: false,
  });

  const rasterIn = smoothstep(Math.max(0, (t - 0.18) / 0.82));
  if (rasterIn <= 0.002) return;

  const slide = (1 - rasterIn) * (L.rasterH + L.marginBottom + h * 0.06);
  ctx.save();
  ctx.globalAlpha = rasterIn;
  ctx.beginPath();
  ctx.rect(L.marginX, L.rasterY, L.rasterW, L.rasterH + slide);
  ctx.clip();
  ctx.translate(0, slide);
  macroPop.drawPopRaster(ctx, L.marginX, L.rasterY, L.rasterW, L.rasterH);
  ctx.restore();
}

function macroHistoryActive(tSec) {
  const key = sceneAt(tSec).scene.key;
  return key === "macro" || key === "macroRaster";
}

function updateDebugPanel(st) {
  if (!SHOW_DEBUG) return;
  const { scene, tInScene, u, index, tGlobal } = st;
  const frame = frameFromTime(tGlobal);
  const frameMax = timelineFrameCount() - 1;
  debugTitle.textContent = scene.title;
  debugDesc.textContent = scene.description;
  debugTime.textContent = `${tInScene.toFixed(2)}s / ${scene.duration.toFixed(1)}s · global ${tGlobal.toFixed(2)}s`;
  debugFrame.textContent = `frame ${frame} / ${frameMax} @ ${RECORD_FPS}fps`;
  const next = SCENES[index + 1];
  if (next) {
    debugNext.textContent = `next → ${next.title}`;
  } else if (u >= 1) {
    debugNext.textContent = "end of timeline";
  } else {
    debugNext.textContent = "—";
  }
  if (!scrubbing) debugSlider.value = String(frame);
  sceneJumpBtns.forEach((btn, i) => {
    btn.classList.toggle("active", i === index);
  });
  if (macroTunePanel) {
    const showTune = scene.key === "macro";
    macroTunePanel.classList.toggle("hidden", !showTune);
    if (showTune) syncMacroTuneReadouts();
  }
}

function draw() {
  const { w, h } = fitCanvas(canvas, ctx);
  canvas._fw = w;
  canvas._fh = h;

  const tSec = getTSec();
  const st = sceneAt(tSec);
  const L = layout(w, h);

  ctx.fillStyle = PALETTE.bg;
  ctx.fillRect(0, 0, w, h);

  if (st.scene.key === "micro") {
    drawSceneMicro(L);
  } else if (st.scene.key === "transition") {
    drawSceneTransition(L, st.animU, w, h);
  } else if (st.scene.key === "pair") {
    drawScenePair(L, st.animU, w, h);
  } else if (st.scene.key === "dualZoomOut") {
    drawSceneDualZoomOut(L, st.u, w, h);
  } else if (st.scene.key === "macro") {
    drawSceneMacro(L, st.u, w, h);
  } else if (st.scene.key === "macroRaster") {
    drawSceneMacroRaster(L, st.animU, w, h);
  }

  ctx.strokeStyle = "rgba(252,255,164,0.45)";
  ctx.lineWidth = 3;
  ctx.strokeRect(1.5, 1.5, w - 3, h - 3);

  updateDebugPanel(st);
}

function loop() {
  const tSec = getTSec();
  const st = sceneAt(tSec);

  if (st.scene.key === "macro" && prevSceneKey !== "macro" && prevSceneKey !== "macroRaster") {
    macroPop.clearPopHistory();
  }
  if (st.scene.key === "macroRaster" && prevSceneKey !== "macroRaster" && macroPop.popHistory.length < 32) {
    macroPop._recordHistory = true;
    for (let i = 0; i < 100; i++) macroPop.macroStep();
  }
  macroPop._recordHistory = macroHistoryActive(tSec);
  prevSceneKey = st.scene.key;

  if (!paused) {
    res.step(2);
    resB.step(2);
    if (st.scene.key === "macro" || st.scene.key === "macroRaster") {
      for (let i = 0; i < 4; i++) macroPop.macroStep();
    } else if (getMacroGraphU(tSec) > 0) {
      macroPop.macroStep();
      macroPop.macroStep();
    }
    tPaused = tSec;
  }
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
